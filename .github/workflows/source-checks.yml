name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax-and-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q prismatic scripts vla-scripts experiments pm-scripts
      - run: python -m unittest discover -s tests -v
  pi05-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q pi05
